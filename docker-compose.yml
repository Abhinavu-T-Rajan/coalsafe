services:
  postgres:
    image: postgres:16-alpine
    container_name: coalsafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coalsafe
      POSTGRES_USER: coalsafe
      POSTGRES_PASSWORD: coalsafe_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coalsafe -d coalsafe"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
